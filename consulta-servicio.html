<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#06152b">
<meta name="description" content="Consulta sobre los servicios de HAL Garage.">
<title>Consulta de servicio | HAL Garage</title>
<style>
:root{--bg:#06152b;--blue:#087ee8;--cyan:#35c7ff;--muted:#b3c3d7;--line:#244565;--white:#f8fbff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#0a4c88 0,transparent 42%),var(--bg);color:var(--white);font:16px/1.6 Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(900px,92%);margin:auto}
header{padding:18px 0;border-bottom:1px solid var(--line);background:#041126}.brand{font-weight:900;font-size:1.2rem}.brand span{color:var(--cyan)}main{padding:42px 0}.panel{background:#081d36;border:1px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,36px)}.eyebrow{color:var(--cyan);font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.1;margin:10px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.field{margin:10px 0}.field label{display:block;font-size:.9rem;margin-bottom:5px;color:#d1e2f4}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #2b4d6e;border-radius:8px;background:#06172c;color:#fff;font:inherit}.field textarea{min-height:100px;resize:vertical}.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 18px;border:0;border-radius:8px;background:linear-gradient(110deg,#087be8,#22baff);font-weight:800;color:#fff;cursor:pointer}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.btn.alt{background:transparent;border:1px solid #47749d}@media(max-width:600px){.grid{grid-template-columns:1fr}.actions .btn{width:100%}}
</style></head>
<body><header><div class="wrap"><a class="brand" href="index.html">HAL <span>GARAGE</span></a></div></header>
<main class="wrap"><section class="panel"><div class="eyebrow">Atención personalizada</div><h1>Consulta sobre un servicio</h1><p class="muted">Déjanos tus datos y resolveremos tus dudas. Este formulario prepara un mensaje para WhatsApp; podrás revisarlo y enviarlo tú mismo. No es una reserva ni confirma una cita.</p>
<form id="inquiryForm"><div class="grid">
<div class="field"><label for="name">Nombre *</label><input id="name" required autocomplete="name" placeholder="Tu nombre"></div>
<div class="field"><label for="phone">Teléfono *</label><input id="phone" required type="tel" autocomplete="tel" placeholder="Tu número de contacto"></div>
<div class="field"><label for="vehicle">Tipo de vehículo *</label><select id="vehicle" required><option value="">Selecciona una opción</option><option>Auto</option><option>SUV / camioneta</option><option>Camioneta XL / pick-up</option><option>Flota empresarial</option><option>Otro</option></select></div>
<div class="field"><label for="service">Servicio de interés *</label><input id="service" required placeholder="Servicio que deseas consultar"></div>
</div><div class="field"><label for="comments">¿Qué deseas consultar? (opcional)</label><textarea id="comments" placeholder="Cuéntanos qué necesitas saber sobre el servicio"></textarea></div>
<div class="actions"><button class="btn" type="submit">Enviar consulta por WhatsApp</button><a class="btn alt" href="servicios.html">Volver a servicios</a></div></form></section></main>
<script>
const params=new URLSearchParams(location.search);const service=params.get('servicio');if(service)document.getElementById('service').value=service;
document.getElementById('inquiryForm').addEventListener('submit',e=>{e.preventDefault();const val=id=>document.getElementById(id).value.trim();const message='Hola HAL Garage, quisiera consultar sobre un servicio.\\nNombre: '+val('name')+'\\nTeléfono: '+val('phone')+'\\nTipo de vehículo: '+val('vehicle')+'\\nServicio de interés: '+val('service')+'\\nConsulta: '+(val('comments')||'Sin comentarios adicionales');location.href='https://wa.me/51904881370?text='+encodeURIComponent(message);});
</script></body></html>
